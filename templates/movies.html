{% extends "base.html" %}
{% block content %}

<a href="{{ url_for('index') }}" class="back-link">← Back to Users</a>

<h1>Movies for {{ user.name }}</h1>

<section class="user-list">
    {% for movie in movies %}
        <article class="user-card">
            <img src="{{ movie.poster_url }}" alt="Poster von {{ movie.name }}">

            <form action="{{ url_for('update_movie', user_id=user_id, movie_id=movie.id) }}" method="post">
                <input type="text"
                       id="new_title_{{ movie.id }}"
                       name="new_title"
                       value="{{ movie.name }}"
                       required>
                <button type="submit" class="update-button">Update</button>
            </form>

            <p><strong>Year:</strong> {{ movie.year }}</p>
            <p><strong>Director:</strong> {{ movie.director }}</p>

            <form action="{{ url_for('delete_movie', user_id=user_id, movie_id=movie.id) }}" method="post">
                <button type="submit" onclick="return confirm('Delete this movie?')" class="delete-button">
                    Delete
                </button>
            </form>

        </article>
    {% else %}
        <p class="empty-message">No movies yet.</p>
    {% endfor %}
</section>

{% if message %}
    <p>{{ message }}</p>
{% endif %}

<div class="add_content">
    <h3>Add New Movie</h3>
    <form action="{{ url_for('add_movie', user_id=user_id) }}" method="post">

        <div class="add_content_input">
            <input type="text" id="title" name="title" placeholder="Movie title" required>
<input type="text" id="year" name="year" placeholder="Year (optional)">
        </div>

        <button type="submit">Add Movie</button>

    </form>
</div>

{% endblock %}
